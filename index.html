<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KruBoard — Educational Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sriracha&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = { theme: { extend: { fontFamily: { mali: ['Mali', 'Sriracha', 'system-ui', 'sans-serif'] } } } }
</script>

<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Mali', sans-serif; background-color: #F9FAFB; }
  
  /* Neobrutalism Core */
  .nb-card { background: #fff; border: 2px solid #111827; border-radius: 12px; box-shadow: 4px 4px 0 #000; }
  .nb-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    border: 2px solid #111827; border-radius: 10px; padding: .5rem .9rem;
    font-weight: 700; font-size: .875rem; box-shadow: 3px 3px 0 #000; cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease, background .15s; white-space: nowrap;
  }
  .nb-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .nb-btn-y { background: #FDE047; } .nb-btn-y:hover { background: #fde68a; }
  .nb-btn-w { background: #fff; } .nb-btn-w:hover { background: #F3F4F6; }
  .nb-btn-k { background: #111827; color: #fff; } .nb-btn-k:hover { background: #1f2937; }
  .nb-btn-r { background: #FCA5A5; } .nb-btn-r:hover { background: #f87171; }
  .nb-btn-s { padding: .3rem .65rem; font-size: .75rem; border-radius: 8px; box-shadow: 2px 2px 0 #000; }

  .nb-input {
    width: 100%; border: 2px solid #111827; border-radius: 10px;
    padding: .5rem .75rem; background: #fff; font-family: inherit;
    font-size: .9rem; outline: none; transition: box-shadow .12s;
  }
  .nb-input:focus { box-shadow: 3px 3px 0 #FDE047; }
  .nb-tab { border: 2px solid #111827; border-radius: 999px; padding: .35rem .9rem; font-weight: 700; font-size: .8rem; background: #fff; box-shadow: 2px 2px 0 #000; cursor: pointer; }
  .nb-tab.active { background: #FDE047; }

  /* Sidebar */
  .nav-item.active { background: #FDE047; border-color: #111827 !important; box-shadow: 3px 3px 0 #000; }
  nav::-webkit-scrollbar { width: 8px; }
  nav::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  nav::-webkit-scrollbar-track { background: transparent; }

  /* Animations */
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .16s ease-out; }
  @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .slide-up { animation: slideUp .2s ease-out; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .18s; }
  .bar { transition: height .4s cubic-bezier(.4,0,.2,1); }
</style>
</head>

<body class="text-[#111827] antialiased">

<!-- ============================================================
     VIEW 1: AUTHENTICATION (LOGIN / REGISTER)
============================================================ -->
<div id="authView" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#F9FAFB] overflow-y-auto">
  <div class="w-full max-w-md my-8">
    <div class="text-center mb-6">
      <div class="w-20 h-20 bg-[#FDE047] border-2 border-black shadow-[4px_4px_0_#000] rounded-2xl grid place-items-center text-5xl mx-auto mb-4">🐻</div>
      <h1 class="text-3xl font-bold">KruBoard</h1>
      <p class="text-sm text-gray-500 mt-1">ระบบจัดการห้องเรียน</p>
    </div>

    <div class="nb-card p-6">
      <div class="flex gap-2 mb-6">
        <button id="tabLogin" class="nb-btn flex-1 bg-[#FDE047]" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tabRegister" class="nb-btn flex-1 bg-white" onclick="switchAuthTab('register')">Sign Up</button>
      </div>

      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div><label class="text-xs font-bold">อีเมล</label><input type="email" id="loginEmail" class="nb-input mt-1" required placeholder="email@school.ac.th"></div>
        <div><label class="text-xs font-bold">รหัสผ่าน</label><input type="password" id="loginPass" class="nb-input mt-1" required placeholder="••••••••"></div>
        <button type="submit" class="nb-btn nb-btn-k w-full !py-3">เข้าสู่ระบบ</button>
      </form>

      <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
        <div><label class="text-xs font-bold">ชื่อ-นามสกุล</label><input type="text" id="regName" class="nb-input mt-1" required placeholder="เช่น ครูสมศรี / น้องแนน"></div>
        <div><label class="text-xs font-bold">อีเมล</label><input type="email" id="regEmail" class="nb-input mt-1" required placeholder="email@school.ac.th"></div>
        <div><label class="text-xs font-bold">รหัสผ่าน</label><input type="password" id="regPass" class="nb-input mt-1" required placeholder="••••••••"></div>
        <div><label class="text-xs font-bold">สมัครเป็น</label>
          <select id="regRole" class="nb-input mt-1">
            <option value="teacher">ครู (Teacher)</option>
            <option value="student">นักเรียน (Student)</option>
          </select>
        </div>
        <button type="submit" class="nb-btn nb-btn-y w-full !py-3">สมัครสมาชิก</button>
      </form>
    </div>
  </div>
</div>

<!-- ============================================================
     VIEW 2: MAIN APPLICATION
============================================================ -->
<div id="appView" class="hidden min-h-screen flex flex-col">
  <div id="mobileOverlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white border-r-2 border-black flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="px-4 py-4 border-b-2 border-black flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#FDE047] border-2 border-black shadow-[3px_3px_0_#000] grid place-items-center text-xl shrink-0">🐻</div>
      <div class="min-w-0">
        <div class="font-bold text-lg leading-none">KruBoard</div>
        <div id="uiRoleLabel" class="text-[11px] text-gray-500 mt-0.5">...</div>
      </div>
      <button id="closeSidebar" class="lg:hidden nb-btn nb-btn-w nb-btn-s ml-auto">✕</button>
    </div>
    
    <nav id="sidebarNav" class="flex-1 overflow-y-auto px-3 py-3 space-y-0.5"></nav>
    
    <div class="border-t-2 border-black px-3 py-3 space-y-0.5 bg-[#F9FAFB]">
      <div id="sidebarBottom"></div>
      <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-3 py-2 mt-2 rounded-lg border-2 border-red-500 bg-red-100 hover:bg-red-200 font-bold text-sm text-red-700 transition">
        <span class="text-lg w-5 text-center shrink-0">🚪</span>
        <span class="flex-1 truncate">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="lg:pl-72 flex-1 flex flex-col">
    <header class="sticky top-0 z-20 bg-[#F9FAFB]/95 backdrop-blur border-b-2 border-black">
      <div class="flex items-center gap-3 px-4 sm:px-6 py-3">
        <button id="openSidebar" class="lg:hidden nb-btn nb-btn-w nb-btn-s">☰</button>
        <div class="min-w-0 flex-1">
          <div id="breadcrumb" class="text-[11px] text-gray-500 font-bold truncate">หน้าแรก</div>
          <div id="pageTitle" class="font-bold text-sm sm:text-base truncate">แดชบอร์ด</div>
        </div>
        <div id="termBadge" class="hidden sm:flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg border-2 border-black bg-[#FDE047] shadow-[2px_2px_0_#000]">
          📅 <span>2/2569</span>
        </div>
        <div class="flex items-center gap-2 pl-2 border-l-2 border-black">
          <div id="uiAvatar" class="w-9 h-9 rounded-full border-2 border-black bg-[#FDE047] grid place-items-center text-lg shadow-[2px_2px_0_#000]">👩‍🏫</div>
          <div class="hidden sm:block leading-tight">
            <div id="uiUserName" class="text-xs font-bold">...</div>
            <div id="uiUserRole" class="text-[10px] text-gray-500">...</div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 pb-24">
      
      <!-- SETUP WIZARD (Empty State) -->
      <div id="setupWizard" class="hidden max-w-2xl mx-auto mt-10">
        <div class="nb-card p-8 text-center">
          <div id="setupIcon" class="text-7xl mb-4">🪄</div>
          <h2 id="setupTitle" class="text-2xl font-bold mb-2">ยินดีต้อนรับ!</h2>
          <p id="setupDesc" class="text-sm text-gray-500 mb-8">...</p>
          <form id="setupForm" class="max-w-sm mx-auto space-y-4 text-left border-t-2 border-dashed border-gray-300 pt-6" onsubmit="handleSetup(event)">
            <div id="setupInputContainer">
              <label id="setupInputLabel" class="text-xs font-bold">...</label>
              <input type="text" id="setupInput" class="nb-input mt-1" required>
            </div>
            <button id="setupBtn" type="submit" class="nb-btn nb-btn-y w-full !py-3">ดำเนินการต่อ</button>
          </form>
        </div>
      </div>

      <!-- MAIN DYNAMIC CONTENT -->
      <div id="dashboardContainer" class="hidden"></div>

    </main>
  </div>
</div>

<!-- MODALS & TOAST -->
<div id="modalLayer" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div id="modalPanel" class="relative w-full max-w-md max-h-[90vh] overflow-y-auto nb-card p-5 pop"></div>
</div>
<div id="toastBox" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 items-end pointer-events-none"></div>

<!-- TEMPLATES -->
<template id="tpl-mission">
  <h3 class="text-lg font-bold mb-1">สร้างภารกิจใหม่ 📋</h3>
  <div class="space-y-3 mt-3">
    <div><label class="text-xs font-bold">ชื่อภารกิจ</label><input id="f-title" class="nb-input mt-1" required></div>
    <div><label class="text-xs font-bold">วิชา (เลือกห้อง)</label><select id="f-mission-room" class="nb-input mt-1"></select></div>
    <div><label class="text-xs font-bold">กำหนดส่ง</label><input id="f-due" type="date" class="nb-input mt-1"></div>
  </div>
  <div class="flex gap-2 justify-end mt-5">
    <button class="nb-btn bg-gray-200" data-close>ยกเลิก</button>
    <button class="nb-btn nb-btn-y" data-act="save-mission">บันทึก</button>
  </div>
</template>

<template id="tpl-grade">
  <h3 class="text-lg font-bold mb-1">บันทึกผล 🎯</h3>
  <div class="space-y-3 mt-3">
    <div><label class="text-xs font-bold">ชื่องาน</label><input id="f-grade-task" class="nb-input mt-1" required></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs font-bold">คะแนนเต็ม</label><input id="f-grade-total" type="number" value="10" class="nb-input mt-1"></div>
      <div><label class="text-xs font-bold">คะแนนผ่าน</label><input id="f-grade-pass" type="number" value="5" class="nb-input mt-1"></div>
    </div>
  </div>
  <div class="flex gap-2 justify-end mt-5">
    <button class="nb-btn bg-gray-200" data-close>ยกเลิก</button>
    <button class="nb-btn nb-btn-y" data-act="save-grade">บันทึกผล</button>
  </div>
</template>

<template id="tpl-subject">
  <h3 class="text-lg font-bold mb-1">เพิ่มวิชา/ห้องเรียน 📚</h3>
  <div class="space-y-3 mt-3">
    <div><label class="text-xs font-bold">ชื่อวิชา / ชื่อห้อง</label><input id="f-subject-name" class="nb-input mt-1" required></div>
    <div><label class="text-xs font-bold">สีวิชา</label><div id="f-subject-colors" class="flex flex-wrap gap-2 mt-2"></div></div>
  </div>
  <div class="flex gap-2 justify-end mt-5">
    <button class="nb-btn bg-gray-200" data-close>ยกเลิก</button>
    <button class="nb-btn nb-btn-y" data-act="save-subject">บันทึก</button>
  </div>
</template>

<script>
/* ============================================================
   CONFIG & STATE
============================================================ */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbxEBZIcwQQbOO4oeKaMEZspNFa1OIFPujM5_8Lv8CcpjbyrA5K0Mg4fUevsKz-JM1HgCw/exec' };

const state = {
  user: null,
  classrooms: [],
  missions: [],
  grades: [],
  currentRoom: null,
  ui: {
    page: 'dashboard',
    missionFilter: 'all',
    sel: {}
  }
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const SUBJ_EMOJI = { 'คณิตศาสตร์': '➗', 'บูรณาการ': '🧩', 'ภาษาไทย': '🇹🇭', 'วิทยาศาสตร์': '🔬', 'อังกฤษ': '🔤', 'อื่นๆ': '✨' };
const MOODS = [
  { key: 'สดใส', emoji: '😄', color: '#A7F3D0' },
  { key: 'โอเคอยู่', emoji: '🙂', color: '#FDE047' },
  { key: 'หนักใจ', emoji: '😟', color: '#FDBA74' },
  { key: 'หนักใจมาก', emoji: '😫', color: '#FCA5A5' },
  { key: 'บอกไม่ถูก', emoji: '😐', color: '#D1D5DB' }
];

function toast(msg, type = 'ok') {
  const box = $('#toastBox');
  const bg = type === 'ok' ? '#A7F3D0' : type === 'error' ? '#FCA5A5' : '#FDE047';
  const el = document.createElement('div');
  el.className = 'nb-card px-4 py-2.5 font-bold text-sm slide-up pointer-events-auto max-w-xs';
  el.style.background = bg;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
   API HELPER
============================================================ */
async function api(action, payload = {}) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=${action}`, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API Error');
    return json.data;
  } catch (err) {
    toast(err.message, 'error');
    throw err;
  }
}

/* ============================================================
   AUTHENTICATION
============================================================ */
function switchAuthTab(type) {
  $('#loginForm').classList.toggle('hidden', type !== 'login');
  $('#registerForm').classList.toggle('hidden', type !== 'register');
  $('#tabLogin').className = type === 'login' ? 'nb-btn flex-1 bg-[#FDE047]' : 'nb-btn flex-1 bg-white';
  $('#tabRegister').className = type === 'register' ? 'nb-btn flex-1 bg-[#FDE047]' : 'nb-btn flex-1 bg-white';
}

async function handleLogin(e) {
  e.preventDefault();
  try {
    const res = await api('login', { Email: $('#loginEmail').value, Password: $('#loginPass').value });
    localStorage.setItem('kruboard_user', JSON.stringify(res));
    state.user = res;
    initApp();
  } catch (err) { toast('เข้าสู่ระบบไม่สำเร็จ: ' + err.message, 'error'); }
}

async function handleRegister(e) {
  e.preventDefault();
  try {
    await api('register', {
      Name: $('#regName').value, Email: $('#regEmail').value,
      Password: $('#regPass').value, Role: $('#regRole').value
    });
    toast('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
    switchAuthTab('login');
    $('#loginEmail').value = $('#regEmail').value;
  } catch (err) { toast('สมัครไม่สำเร็จ: ' + err.message, 'error'); }
}

function handleLogout() { localStorage.removeItem('kruboard_user'); location.reload(); }

/* ============================================================
   APP INITIALIZATION
============================================================ */
async function initApp() {
  $('#authView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  
  $('#uiUserName').textContent = state.user.Name;
  $('#uiUserRole').textContent = state.user.Role === 'teacher' ? 'ครูผู้สอน' : 'นักเรียน';
  $('#uiAvatar').textContent = state.user.Role === 'teacher' ? '👩‍🏫' : '🧑‍🎓';
  $('#uiRoleLabel').textContent = state.user.Role === 'teacher' ? 'สำหรับครู' : 'สำหรับนักเรียน';

  if (state.user.Role === 'teacher') {
    state.classrooms = await api('getMyClassrooms', { TeacherID: state.user.ID });
    if (state.classrooms.length === 0) { showSetup('teacher'); return; }
  } else {
    state.classrooms = await api('getStudentClassrooms', { StudentID: state.user.ID });
    if (state.classrooms.length === 0) { showSetup('student'); return; }
  }
  
  renderApp();
}

function showSetup(role) {
  $('#setupWizard').classList.remove('hidden');
  $('#dashboardContainer').classList.add('hidden');
  if (role === 'teacher') {
    $('#setupIcon').textContent = '🏫';
    $('#setupTitle').textContent = 'สร้างห้องเรียนแรกของคุณ';
    $('#setupDesc').textContent = 'สร้างห้องเรียนเพื่อให้นักเรียนเข้าร่วมด้วยรหัสห้อง';
    $('#setupInputLabel').textContent = 'ชื่อห้องเรียน / วิชา';
    $('#setupInput').placeholder = 'เช่น ม.1/1 คณิตศาสตร์';
    $('#setupBtn').textContent = '+ สร้างห้องเรียน';
  } else {
    $('#setupIcon').textContent = '🔑';
    $('#setupTitle').textContent = 'เข้าห้องเรียน';
    $('#setupDesc').textContent = 'กรุณากรอกรหัสห้อง 6 หลักที่ได้รับจากคุณครู';
    $('#setupInputLabel').textContent = 'รหัสห้องเรียน';
    $('#setupInput').placeholder = 'เช่น A7B9C2';
    $('#setupInput').style.textTransform = 'uppercase';
    $('#setupBtn').textContent = 'เข้าห้องเรียน';
  }
}

async function handleSetup(e) {
  e.preventDefault();
  const val = $('#setupInput').value.trim();
  if (!val) return;
  try {
    if (state.user.Role === 'teacher') {
      const room = await api('createClassroom', { Name: val, TeacherID: state.user.ID });
      toast(`สร้างห้องสำเร็จ! รหัสห้องคือ ${room.ClassCode}`, 'ok');
    } else {
      await api('joinClassroom', { ClassCode: val, StudentID: state.user.ID });
      toast('เข้าห้องเรียนสำเร็จ!', 'ok');
    }
    setTimeout(() => initApp(), 1000);
  } catch (err) { toast(err.message, 'error'); }
}

/* ============================================================
   SIDEBAR & NAVIGATION
============================================================ */
const TEACHER_NAV = [
  { title: 'ภาพรวม', items: [
    { id: 'dashboard', label: 'แดชบอร์ด', icon: '🏠' },
    { id: 'missions', label: 'ภารกิจ', icon: '📋' }
  ]},
  { title: 'ห้องเรียน', items: [
    { id: 'classrooms', label: 'ห้องเรียนของฉัน', icon: '🏫' },
    { id: 'mental', label: 'เช็กสภาพใจ', icon: '💚' }
  ]},
  { title: 'จัดการ', items: [
    { id: 'gradebook', label: 'คะแนนเก็บ/ตัดเกรด', icon: '🎯' },
    { id: 'terms', label: 'เทอม / Export', icon: '📤' },
    { id: 'settings', label: 'ตั้งค่า', icon: '⚙️' }
  ]}
];

const STUDENT_NAV = [
  { title: 'ของฉัน', items: [
    { id: 'dashboard', label: 'หน้าหลัก', icon: '🏠' },
    { id: 'missions', label: 'การบ้าน/ภารกิจ', icon: '📋' },
    { id: 'grades', label: 'คะแนนของฉัน', icon: '🎯' },
    { id: 'mental', label: 'เช็กสภาพใจ', icon: '💚' }
  ]}
];

function renderSidebar() {
  const nav = state.user.Role === 'teacher' ? TEACHER_NAV : STUDENT_NAV;
  $('#sidebarNav').innerHTML = nav.map(sec => `
    <div class="pt-3 pb-1 px-2 text-[11px] font-bold tracking-wide text-gray-400">${sec.title}</div>
    ${sec.items.map(item => `
      <a href="#" onclick="renderPage('${item.id}')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg border-2 border-transparent hover:border-black hover:bg-[#FEF9C3] font-medium text-sm transition" data-nav="${item.id}">
        <span class="text-lg w-5 text-center shrink-0">${item.icon}</span>
        <span class="flex-1 truncate">${item.label}</span>
      </a>
    `).join('')}
  `).join('');
}

function renderApp() {
  $('#setupWizard').classList.add('hidden');
  $('#dashboardContainer').classList.remove('hidden');
  renderSidebar();
  renderPage('dashboard');
}

/* ============================================================
   PAGE RENDERERS
============================================================ */
const PAGE_TITLES = {
  dashboard: 'แดชบอร์ด', missions: 'ภารกิจ', classrooms: 'ห้องเรียน',
  mental: 'เช็กสภาพใจ', gradebook: 'คะแนนเก็บ', terms: 'เทอม / Export',
  grades: 'คะแนนของฉัน', settings: 'ตั้งค่า'
};

async function renderPage(page) {
  state.ui.page = page;
  $('#pageTitle').textContent = PAGE_TITLES[page] || 'KruBoard';
  $('#breadcrumb').textContent = 'หน้าแรก / ' + ($('#pageTitle').textContent);
  $$('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === page));
  
  const view = $('#dashboardContainer');
  view.innerHTML = `<div class="py-20 text-center text-gray-400">⏳ กำลังโหลด...</div>`;

  try {
    if (state.user.Role === 'teacher') {
      if (page === 'dashboard') view.innerHTML = await renderTeacherDashboard();
      else if (page === 'missions') view.innerHTML = await renderTeacherMissions();
      else if (page === 'classrooms') view.innerHTML = renderTeacherClassrooms();
      else if (page === 'mental') view.innerHTML = await renderMental();
      else if (page === 'gradebook') view.innerHTML = await renderGradebook();
      else if (page === 'terms') view.innerHTML = renderTerms();
      else if (page === 'settings') view.innerHTML = renderSettings();
    } else {
      if (page === 'dashboard') view.innerHTML = await renderStudentDashboard();
      else if (page === 'missions') view.innerHTML = await renderStudentMissions();
      else if (page === 'grades') view.innerHTML = await renderStudentGrades();
      else if (page === 'mental') view.innerHTML = renderStudentMental();
    }
  } catch (err) {
    view.innerHTML = `<div class="p-6 text-red-500">เกิดข้อผิดพลาด: ${err.message}</div>`;
  }
}

/* ============================================================
   MODALS & ACTIONS
============================================================ */
function openModal(tplId, fill) {
  const tpl = document.getElementById(tplId);
  $('#modalPanel').replaceChildren(tpl.content.cloneNode(true));
  if (fill) fill($('#modalPanel'));
  $('#modalLayer').classList.remove('hidden'); $('#modalLayer').classList.add('flex');
}

function closeModal() {
  $('#modalLayer').classList.add('hidden'); $('#modalLayer').classList.remove('flex');
}

function openMissionModal() {
  openModal('tpl-mission', (panel) => {
    panel.querySelector('#f-mission-room').innerHTML = state.classrooms.map(c => `<option value="${c.ID}">${esc(c.Name)}</option>`).join('');
  });
}

function openGradeModal(classId) {
  openModal('tpl-grade');
  // Logic to save grade would go here
}

function openSubjectModal() {
  openModal('tpl-subject', (panel) => {
    const colors = ['#FDE047', '#A7F3D0', '#BFDBFE', '#FBCFE8', '#FED7AA'];
    const wrap = panel.querySelector('#f-subject-colors');
    wrap.innerHTML = colors.map(c => `<button class="w-8 h-8 rounded border-2 border-black" style="background:${c}" data-color="${c}"></button>`).join('');
    wrap.dataset.selected = colors[0];
    wrap.addEventListener('click', ev => {
      if(ev.target.dataset.color) {
        wrap.querySelectorAll('button').forEach(b => b.classList.remove('ring-2', 'ring-black'));
        ev.target.classList.add('ring-2', 'ring-black');
        wrap.dataset.selected = ev.target.dataset.color;
      }
    });
  });
}

async function saveFbSettings() {
  try {
    await api('saveSetting', { Key: 'FB_PAGE_TOKEN', Value: $('#fbToken').value });
    await api('saveSetting', { Key: 'FB_PSID_' + state.user.ID, Value: $('#fbPsid').value });
    toast('บันทึกการตั้งค่าสำเร็จ!');
  } catch (err) { toast(err.message, 'error'); }
}

async function saveMental(mood) {
  try {
    await api('saveMentalCheckin', { StudentID: state.user.ID, Mood: mood, Notes: '' });
    toast('บันทึกสภาพใจแล้ว 💚');
  } catch (err) { toast(err.message, 'error'); }
}

// Global Event Delegation
document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  if (e.target.closest('#openSidebar')) { $('#sidebar').classList.remove('-translate-x-full'); $('#mobileOverlay').classList.remove('hidden'); return; }
  if (e.target.closest('#closeSidebar') || e.target.closest('#mobileOverlay')) { $('#sidebar').classList.add('-translate-x-full'); $('#mobileOverlay').classList.add('hidden'); return; }

  const t = e.target.closest('[data-act]');
  if (!t) return;

  if (t.dataset.act === 'save-mission') {
    const title = $('#f-title').value;
    const roomId = $('#f-mission-room').value;
    const due = $('#f-due').value;
    if (!title || !roomId) return toast('กรอกข้อมูลไม่ครบ', 'error');
    try {
      const m = await api('createMission', { ClassroomID: roomId, Title: title, DueDate: due });
      state.missions.unshift(m);
      closeModal(); toast('สร้างภารกิจสำเร็จ'); renderPage('missions');
    } catch (err) { toast(err.message, 'error'); }
  }
  
  if (t.dataset.act === 'save-subject') {
    const name = $('#f-subject-name').value;
    const color = $('#f-subject-colors').dataset.selected;
    if (!name) return toast('กรอกชื่อห้อง', 'error');
    try {
      const c = await api('createClassroom', { Name: name, TeacherID: state.user.ID });
      state.classrooms.push(c);
      closeModal(); toast('สร้างห้องสำเร็จ'); renderPage('classrooms');
    } catch (err) { toast(err.message, 'error'); }
  }
});

// Boot
document.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('kruboard_user');
  if (savedUser) { state.user = JSON.parse(savedUser); initApp(); }
});
</script>
