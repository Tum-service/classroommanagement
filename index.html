<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KruBoard — Educational Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sriracha&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = { theme: { extend: { fontFamily: { mali: ['Mali', 'Sriracha', 'system-ui', 'sans-serif'] } } } }
</script>

<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Mali', sans-serif; background-color: #F9FAFB; }
  
  /* Neobrutalism Core */
  .nb-card { background: #fff; border: 2px solid #111827; border-radius: 12px; box-shadow: 4px 4px 0 #000; }
  .nb-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    border: 2px solid #111827; border-radius: 10px; padding: .5rem .9rem;
    font-weight: 700; font-size: .875rem; box-shadow: 3px 3px 0 #000; cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease, background .15s; white-space: nowrap;
  }
  .nb-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .nb-btn-y { background: #FDE047; } .nb-btn-y:hover { background: #fde68a; }
  .nb-btn-w { background: #fff; } .nb-btn-w:hover { background: #F3F4F6; }
  .nb-btn-k { background: #111827; color: #fff; } .nb-btn-k:hover { background: #1f2937; }
  .nb-btn-r { background: #FCA5A5; } .nb-btn-r:hover { background: #f87171; }
  .nb-btn-s { padding: .3rem .65rem; font-size: .75rem; border-radius: 8px; box-shadow: 2px 2px 0 #000; }

  .nb-input {
    width: 100%; border: 2px solid #111827; border-radius: 10px;
    padding: .5rem .75rem; background: #fff; font-family: inherit;
    font-size: .9rem; outline: none; transition: box-shadow .12s;
  }
  .nb-input:focus { box-shadow: 3px 3px 0 #FDE047; }
  .nb-tab { border: 2px solid #111827; border-radius: 999px; padding: .35rem .9rem; font-weight: 700; font-size: .8rem; background: #fff; box-shadow: 2px 2px 0 #000; cursor: pointer; }
  .nb-tab.active { background: #FDE047; }

  /* Sidebar */
  .nav-item.active { background: #FDE047; border-color: #111827 !important; box-shadow: 3px 3px 0 #000; }
  nav::-webkit-scrollbar { width: 8px; }
  nav::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  nav::-webkit-scrollbar-track { background: transparent; }

  /* Animations */
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .16s ease-out; }
  @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .slide-up { animation: slideUp .2s ease-out; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .18s; }
</style>
</head>

<body class="text-[#111827] antialiased">

<!-- ============================================================
     VIEW 1: AUTHENTICATION (LOGIN / REGISTER)
============================================================ -->
<div id="authView" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#F9FAFB]">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-20 h-20 bg-[#FDE047] border-2 border-black shadow-[4px_4px_0_#000] rounded-2xl grid place-items-center text-5xl mx-auto mb-4">🐻</div>
      <h1 class="text-3xl font-bold">KruBoard</h1>
      <p class="text-sm text-gray-500 mt-1">ระบบจัดการห้องเรียนสำหรับครู</p>
    </div>

    <div class="nb-card p-6">
      <!-- Tabs -->
      <div class="flex gap-2 mb-6">
        <button id="tabLogin" class="nb-btn flex-1 bg-[#FDE047]" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tabRegister" class="nb-btn flex-1 bg-white" onclick="switchAuthTab('register')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="text-xs font-bold">อีเมล</label>
          <input type="email" id="loginEmail" class="nb-input mt-1" required placeholder="teacher@school.ac.th">
        </div>
        <div>
          <label class="text-xs font-bold">รหัสผ่าน</label>
          <input type="password" id="loginPass" class="nb-input mt-1" required placeholder="••••••••">
        </div>
        <button type="submit" class="nb-btn nb-btn-k w-full !py-3">เข้าสู่ระบบ</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
        <div>
          <label class="text-xs font-bold">ชื่อ-นามสกุล (ครู)</label>
          <input type="text" id="regName" class="nb-input mt-1" required placeholder="เช่น ครูสมศรี ใจดี">
        </div>
        <div>
          <label class="text-xs font-bold">อีเมล</label>
          <input type="email" id="regEmail" class="nb-input mt-1" required placeholder="teacher@school.ac.th">
        </div>
        <div>
          <label class="text-xs font-bold">รหัสผ่าน</label>
          <input type="password" id="regPass" class="nb-input mt-1" required placeholder="••••••••">
        </div>
        <button type="submit" class="nb-btn nb-btn-y w-full !py-3">สมัครสมาชิก</button>
      </form>
    </div>
  </div>
</div>

<!-- ============================================================
     VIEW 2: MAIN APPLICATION (DASHBOARD)
============================================================ -->
<div id="appView" class="hidden min-h-screen flex flex-col">

  <!-- MOBILE OVERLAY -->
  <div id="mobileOverlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white border-r-2 border-black flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="px-4 py-4 border-b-2 border-black flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#FDE047] border-2 border-black shadow-[3px_3px_0_#000] grid place-items-center text-xl shrink-0">🐻</div>
      <div class="min-w-0">
        <div class="font-bold text-lg leading-none">KruBoard</div>
        <div class="text-[11px] text-gray-500 mt-0.5">ห้องเรียนของครู</div>
      </div>
      <button id="closeSidebar" class="lg:hidden nb-btn nb-btn-w nb-btn-s ml-auto">✕</button>
    </div>
    
    <nav id="sidebarNav" class="flex-1 overflow-y-auto px-3 py-3 space-y-0.5"></nav>
    
    <div class="border-t-2 border-black px-3 py-3 space-y-0.5 bg-[#F9FAFB]">
      <div id="sidebarBottom"></div>
      <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-3 py-2 mt-2 rounded-lg border-2 border-red-500 bg-red-100 hover:bg-red-200 font-bold text-sm text-red-700 transition">
        <span class="text-lg w-5 text-center shrink-0">🚪</span>
        <span class="flex-1 truncate">Sign Out (ออกจากระบบ)</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="lg:pl-72 flex-1 flex flex-col">
    <!-- HEADER -->
    <header class="sticky top-0 z-20 bg-[#F9FAFB]/95 backdrop-blur border-b-2 border-black">
      <div class="flex items-center gap-3 px-4 sm:px-6 py-3">
        <button id="openSidebar" class="lg:hidden nb-btn nb-btn-w nb-btn-s">☰</button>
        <div class="min-w-0 flex-1">
          <div id="breadcrumb" class="text-[11px] text-gray-500 font-bold truncate">หน้าแรก</div>
          <div id="pageTitle" class="font-bold text-sm sm:text-base truncate">แดชบอร์ด</div>
        </div>
        <div id="termBadge" class="hidden sm:flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg border-2 border-black bg-[#FDE047] shadow-[2px_2px_0_#000]">
          📅 <span id="uiTerm">ยังไม่ระบุ</span>
        </div>
        <div id="userChip" class="flex items-center gap-2 pl-2 border-l-2 border-black">
          <div class="w-9 h-9 rounded-full border-2 border-black bg-[#FDE047] grid place-items-center text-lg shadow-[2px_2px_0_#000]">👩‍🏫</div>
          <div class="hidden sm:block leading-tight">
            <div id="uiUserName" class="text-xs font-bold">กำลังโหลด...</div>
            <div class="text-[10px] text-gray-500">ครูผู้สอน</div>
          </div>
        </div>
      </div>
    </header>

    <!-- DYNAMIC VIEWS -->
    <main class="flex-1 p-4 sm:p-6 pb-24">
      
      <!-- A. SETUP WIZARD (แสดงเมื่อยังไม่มีข้อมูล) -->
      <div id="setupWizard" class="hidden max-w-2xl mx-auto mt-10">
        <div class="nb-card p-8 text-center">
          <div class="text-7xl mb-4">🪄</div>
          <h2 class="text-2xl font-bold mb-2">ยินดีต้อนรับ, <span id="setupTeacherName"></span>!</h2>
          <p class="text-sm text-gray-500 mb-8">คุณยังไม่มีข้อมูลในระบบ ให้เริ่มต้นสร้างวิชาแรกเพื่อเปิดใช้งานเมนูทั้งหมด</p>
          
          <form onsubmit="handleCreateFirstSubject(event)" class="max-w-sm mx-auto space-y-4 text-left border-t-2 border-dashed border-gray-300 pt-6">
            <div>
              <label class="text-xs font-bold">ชื่อวิชาแรกของคุณ</label>
              <input type="text" id="firstSubjectName" class="nb-input mt-1" required placeholder="เช่น คณิตศาสตร์ ป.4">
            </div>
            <div>
              <label class="text-xs font-bold">เลือกสีวิชา</label>
              <div class="flex gap-2 mt-1">
                <input type="radio" name="firstSubjColor" value="#FDE047" checked class="w-6 h-6 accent-yellow-400">
                <input type="radio" name="firstSubjColor" value="#A7F3D0" class="w-6 h-6 accent-green-300">
                <input type="radio" name="firstSubjColor" value="#BFDBFE" class="w-6 h-6 accent-blue-300">
                <input type="radio" name="firstSubjColor" value="#FBCFE8" class="w-6 h-6 accent-pink-300">
              </div>
            </div>
            <button type="submit" class="nb-btn nb-btn-y w-full !py-3 mt-4">+ สร้างวิชาและเริ่มใช้งาน</button>
          </form>
        </div>
      </div>

      <!-- B. DASHBOARD & PAGES (แสดงเมื่อมีข้อมูลแล้ว) -->
      <div id="dashboardContainer" class="hidden"></div>

    </main>
  </div>
</div>

<!-- ============================================================
     MODAL TEMPLATES
============================================================ -->
<div id="modalLayer" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div id="modalPanel" class="relative w-full max-w-md max-h-[90vh] overflow-y-auto nb-card p-5 pop"></div>
</div>

<div id="toastBox" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 items-end pointer-events-none"></div>

<template id="tpl-mission">
  <h3 class="text-lg font-bold mb-1">สร้างภารกิจใหม่ 📋</h3>
  <div class="space-y-3 mt-3">
    <div><label class="text-xs font-bold">ชื่อภารกิจ</label><input id="f-mission-title" class="nb-input mt-1" placeholder="เช่น ส่งใบงานคูณเลข"></div>

  <div class="flex gap-2 justify-end mt-5">

  </div>

<template id="tpl-subject">
  <h3 class="text-lg font-bold mb-1">สร้างวิชาใหม่ 📚</h3>
  <div class="space-y-3 mt-3">
    <div><label class="text-xs font-bold">ชื่อวิชา</label><input id="f-subject-name" class="nb-input mt-1" placeholder="เช่น วิทยาศาสตร์"></div>
    <div><label class="text-xs font-bold">สีวิชา</label><div id="f-subject-colors" class="flex flex-wrap gap-2 mt-2"></div></div>
  </div>
  <div class="flex gap-2 justify-end mt-5">
    <button class="nb-btn nb-btn-w" data-close>ยกเลิก</button>
    <button class="nb-btn nb-btn-y" data-act="save-subject">บันทึก</button>
  </div>
</template>

<!-- ============================================================
     APPLICATION LOGIC
============================================================ -->
<script>
/* ============================================================
   1) CONFIG & API
============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxEBZIcwQQbOO4oeKaMEZspNFa1OIFPujM5_8Lv8CcpjbyrA5K0Mg4fUevsKz-JM1HgCw/exec'
};

async function api(action, payload = {}, method = 'POST') {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=${action}`, {
      method: method,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: method === 'POST' ? JSON.stringify({ action, ...payload }) : null
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API Error');
    return json.data;
  } catch (err) {
    toast(err.message, 'error');
    throw err;
  }
}

/* ============================================================
   2) STATE & UTILS
============================================================ */
const state = {
  user: null,
  subjects: [],
  missions: [],
  ui: {
    missionFilter: 'all',
    sel: {}
  }
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const SUBJ_EMOJI = { 'คณิตศาสตร์': '➗', 'บูรณาการ': '🧩', 'ภาษาไทย': '🇹🇭', 'วิทยาศาสตร์': '🔬', 'อังกฤษ': '🔤', 'อื่นๆ': '✨' };

function toast(msg, type = 'ok') {
  const box = $('#toastBox');
  const bg = type === 'ok' ? '#A7F3D0' : type === 'error' ? '#FCA5A5' : '#FDE047';
  const el = document.createElement('div');
  el.className = 'nb-card px-4 py-2.5 font-bold text-sm slide-up pointer-events-auto max-w-xs';
  el.style.background = bg;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
   3) AUTHENTICATION LOGIC
============================================================ */
function switchAuthTab(type) {
  $('#loginForm').classList.toggle('hidden', type !== 'login');
  $('#registerForm').classList.toggle('hidden', type !== 'register');
  $('#tabLogin').className = type === 'login' ? 'nb-btn flex-1 bg-[#FDE047]' : 'nb-btn flex-1 bg-white';
  $('#tabRegister').className = type === 'register' ? 'nb-btn flex-1 bg-[#FDE047]' : 'nb-btn flex-1 bg-white';
}

async function handleLogin(e) {
  e.preventDefault();
  const email = $('#loginEmail').value;
  const pass = $('#loginPass').value;
  try {
    const res = await api('login', { Email: email, Password: pass });
    localStorage.setItem('kruboard_user', JSON.stringify(res));
    state.user = res;
    initApp();
  } catch (err) {
    toast('เข้าสู่ระบบไม่สำเร็จ: ' + err.message, 'error');
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const name = $('#regName').value;
  const email = $('#regEmail').value;
  const pass = $('#regPass').value;
  try {
    await api('register', { Name: name, Email: email, Password: pass });
    toast('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
    switchAuthTab('login');
    $('#loginEmail').value = email;
  } catch (err) {
    toast('สมัครไม่สำเร็จ: ' + err.message, 'error');
  }
}

function handleLogout() {
  localStorage.removeItem('kruboard_user');
  state.user = null;
  state.subjects = [];
  state.missions = [];
  $('#appView').classList.add('hidden');
  $('#authView').classList.remove('hidden');
  $('#setupWizard').classList.add('hidden');
  $('#dashboardContainer').classList.add('hidden');
}

/* ============================================================
   4) APP INITIALIZATION (เช็กว่ามีข้อมูลหรือยัง)
============================================================ */
async function initApp() {
  $('#authView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  
  // อัปเดตชื่อครูที่ Header
  $('#uiUserName').textContent = state.user.Name;
  $('#setupTeacherName').textContent = state.user.Name;

  try {
    // ดึงข้อมูลเฉพาะของครูคนนี้
    const [subjects, missions] = await Promise.all([
      api('getMySubjects', { TeacherID: state.user.ID }, 'GET'),
      api('getMyMissions', { TeacherID: state.user.ID }, 'GET')
    ]);

    state.subjects = subjects || [];
    state.missions = missions || [];

    if (state.subjects.length === 0) {
      // Empty State -> แสดง Setup
      $('#setupWizard').classList.remove('hidden');
      $('#dashboardContainer').classList.add('hidden');
    } else {
      // มีข้อมูล -> แสดง Dashboard
      $('#setupWizard').classList.add('hidden');
      $('#dashboardContainer').classList.remove('hidden');
      
      renderSidebar();
      renderPage('dashboard'); // เริ่มที่หน้าแรก
    }
  } catch (err) {
    toast('ดึงข้อมูลไม่สำเร็จ: ' + err.message, 'error');
  }
}

/* ============================================================
   5) SETUP WIZARD LOGIC
============================================================ */
async function handleCreateFirstSubject(e) {
  e.preventDefault();
  const name = $('#firstSubjectName').value;
  const color = document.querySelector('input[name="firstSubjColor"]:checked').value;
  
  try {
    await api('createSubject', { Name: name, TeacherID: state.user.ID, Color: color });
    toast('สร้างวิชาสำเร็จ! กำลังโหลดหน้าแดชบอร์ด...');
    setTimeout(() => initApp(), 1000); // โหลดแอปใหม่
  } catch (err) {
    toast('สร้างไม่สำเร็จ: ' + err.message, 'error');
  }
}

/* ============================================================
   6) NAVIGATION & ROUTING (ใช้งานได้เมื่อมีข้อมูลแล้ว)
============================================================ */
const NAV_SECTIONS = [
  { title: 'ภาพรวม', items: [
    { id: 'dashboard', label: 'แดชบอร์ด', icon: '🏠' },
    { id: 'missions', label: 'ภารกิจ', icon: '📋' }
  ]},
  { title: 'จัดการ', items: [
    { id: 'subjects', label: 'วิชา', icon: '📚' },
    { id: 'settings', label: 'ตั้งค่าแจ้งเตือน', icon: '⚙️' }
  ]}
];
const NAV_BOTTOM = [
  { id: 'changelog', label: 'มีอะไรใหม่', icon: '✨' }
];
const PAGE_TITLES = {
  dashboard: 'แดชบอร์ด', missions: 'ภารกิจ', subjects: 'วิชา', settings: 'ตั้งค่า'
};

function navLink(item) {
  return `<a href="#/${item.id}" data-nav="${item.id}" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg border-2 border-transparent hover:border-black hover:bg-[#FEF9C3] font-medium text-sm transition">
      <span class="text-lg w-5 text-center shrink-0">${item.icon}</span>
      <span class="flex-1 truncate">${item.label}</span>
    </a>`;
}

function renderSidebar() {
  $('#sidebarNav').innerHTML = NAV_SECTIONS.map(sec => `
    <div class="pt-3 pb-1 px-2 text-[11px] font-bold tracking-wide text-gray-400">${sec.title}</div>
    ${sec.items.map(navLink).join('')}
  `).join('');
  $('#sidebarBottom').innerHTML = NAV_BOTTOM.map(navLink).join('');
}

// Simple Router
function renderPage(page) {
  const view = $('#dashboardContainer');
  const title = PAGE_TITLES[page] || 'KruBoard';
  $('#pageTitle').textContent = title;
  $('#breadcrumb').textContent = 'หน้าแรก / ' + title;
  
  $$('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === page));

  if (page === 'dashboard') view.innerHTML = renderDashboard();
  else if (page === 'missions') view.innerHTML = renderMissions();
  else if (page === 'subjects') view.innerHTML = renderSubjects();
  else if (page === 'settings') view.innerHTML = renderSettings();
  else view.innerHTML = `<div class="p-10 text-center">อยู่ระหว่างการพัฒนา</div>`;
}

/* ============================================================
   7) PAGE RENDERERS
============================================================ */
function renderDashboard() {
  const activeMissions = state.missions.filter(m => m.Status === 'active');
  
  return `
    <div class="mb-6">
      <h1 class="text-2xl font-bold">สวัสดี ${esc(state.user.Name)} 👋</h1>
      <p class="text-sm text-gray-500">ภาพรวมห้องเรียนของคุณ</p>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="nb-card p-4"><div class="text-xs font-bold text-gray-500">วิชาทั้งหมด</div><div class="text-2xl font-bold mt-1">${state.subjects.length}</div></div>
      <div class="nb-card p-4 bg-[#FDE047]"><div class="text-xs font-bold text-gray-700">ภารกิจค้าง</div><div class="text-2xl font-bold mt-1">${activeMissions.length}</div></div>
    </div>
    <div class="nb-card p-4">
      <h2 class="font-bold text-lg mb-4">📋 ภารกิจล่าสุด</h2>
      <div class="space-y-2">
        ${state.missions.length === 0 ? `<div class="text-center py-6 text-gray-400">🐻 ยังไม่มีภารกิจ</div>` : ''}
        ${state.missions.slice(0, 5).map(m => `
          <div class="border-2 border-black rounded-lg p-3 flex items-center gap-3">
            <div class="text-xl">${m.Status === 'active' ? '📋' : '✔️'}</div>
            <div class="flex-1 min-w-0">
              <div class="font-bold truncate">${esc(m.Title)}</div>
              <div class="text-[10px] text-gray-500">กำหนดส่ง: ${m.DueDate || 'ไม่ระบุ'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderMissions() {
  return `
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">ภารกิจ 📋</h1>
      <button class="nb-btn nb-btn-y" data-act="open-mission">+ สร้างภารกิจ</button>
    </div>
    <div class="space-y-3">
      ${state.missions.map(m => `
        <div class="nb-card p-4 flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="font-bold truncate">${esc(m.Title)}</div>
            <div class="text-[11px] text-gray-500">Due: ${m.DueDate || '-'}</div>
          </div>
          <span class="text-[10px] font-bold px-2 py-1 rounded border-2 border-black ${m.Status === 'active' ? 'bg-[#FDE047]' : 'bg-[#A7F3D0]'}">
            ${m.Status === 'active' ? 'กำลังทำ' : 'เสร็จสิ้น'}
          </span>
        </div>
      `).join('')}
    </div>`;
}

function renderSubjects() {
  return `
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">วิชา 📚</h1>
      <button class="nb-btn nb-btn-y" data-act="open-subject">+ เพิ่มวิชา</button>
    </div>
    <div class="grid grid-cols-2 gap-4">
      ${state.subjects.map(s => `
        <div class="nb-card p-4">
          <div class="w-10 h-10 rounded-lg border-2 border-black grid place-items-center text-xl mb-2" style="background:${s.Color}">${SUBJ_EMOJI[s.Name] || '📘'}</div>
          <div class="font-bold text-lg">${esc(s.Name)}</div>
        </div>
      `).join('')}
    </div>`;
}

function renderSettings() {
  return `
    <div class="max-w-2xl">
      <h1 class="text-2xl font-bold mb-2">ตั้งค่าการแจ้งเตือน ⚙️</h1>
      <p class="text-sm text-gray-500 mb-6">เชื่อมต่อ Facebook Messenger เพื่อรับแจ้งเตือนงานค้างส่ง</p>
      
      <div class="nb-card p-6">
        <h2 class="font-bold mb-4">Facebook Messenger</h2>
        <div class="space-y-4">
          <div>
            <label class="text-xs font-bold">Facebook Page Access Token</label>
            <input type="password" id="fbToken" class="nb-input mt-1" placeholder="EAAB...">
            <p class="text-[10px] text-gray-500 mt-1">ดึง Token ได้จาก Facebook Developer App ของคุณ</p>
          </div>
          <div>
            <label class="text-xs font-bold">Facebook PSID (Page-Scoped ID)</label>
            <input type="text" id="fbPsid" class="nb-input mt-1" placeholder="1234567890">
            <p class="text-[10px] text-gray-500 mt-1">ID ของคุณที่ได้จากการทักแชทหา Page</p>
          </div>
          <button class="nb-btn nb-btn-k mt-2" onclick="saveFbSettings()">บันทึกการตั้งค่า</button>
        </div>
      </div>
    </div>`;
}

async function saveFbSettings() {
  const token = $('#fbToken').value;
  const psid = $('#fbPsid').value;
  if(!token || !psid) return toast('กรุณากรอกข้อมูลให้ครบ', 'error');
  
  try {
    await api('saveSetting', { Key: 'FB_PAGE_TOKEN', Value: token });
    await api('saveSetting', { Key: 'FB_PSID_' + state.user.ID, Value: psid });
    // อัปเดต FbPSID ใน Users ด้วย (เพื่อให้ backend รู้ว่าใครคือใคร)
    // หมายเหตุ: ในระบบจริงอาจจะต้องมี API สำหรับ update user
    toast('บันทึกการตั้งค่าสำเร็จ!');
  } catch (err) {
    toast(err.message, 'error');
  }
}

/* ============================================================
   8) MODAL & EVENT HANDLERS
============================================================ */
function openModal(tplId, fill) {
  const tpl = document.getElementById(tplId);
  const layer = $('#modalLayer');
  const panel = $('#modalPanel');
  panel.replaceChildren(tpl.content.cloneNode(true));
  if (fill) fill(panel);
  layer.classList.remove('hidden');
  layer.classList.add('flex');
}

function closeModal() {
  $('#modalLayer').classList.add('hidden');
  $('#modalLayer').classList.remove('flex');
}

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  if (e.target.closest('#openSidebar')) { $('#sidebar').classList.remove('-translate-x-full'); $('#mobileOverlay').classList.remove('hidden'); return; }
  if (e.target.closest('#closeSidebar') || e.target.closest('#mobileOverlay')) { $('#sidebar').classList.add('-translate-x-full'); $('#mobileOverlay').classList.add('hidden'); return; }

  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'open-mission') {
    openModal('tpl-mission', (panel) => {
      const sel = panel.querySelector('#f-mission-subject');
      sel.innerHTML = state.subjects.map(s => `<option value="${s.ID}">${esc(s.Name)}</option>`).join('');
    });
  }
  else if (act === 'save-mission') {
    const title = $('#f-mission-title').value;
    const subjectId = $('#f-mission-subject').value;
    const dueDate = $('#f-mission-due').value;
    if (!title) return toast('กรุณากรอกชื่อภารกิจ', 'error');
    
    try {
      const created = await api('createMission', { Title: title, SubjectID: subjectId, DueDate: dueDate });
      state.missions.unshift(created);
      closeModal();
      toast('สร้างภารกิจสำเร็จ');
      renderPage('missions');
    } catch (err) { toast(err.message, 'error'); }
  }
  else if (act === 'open-subject') {
    openModal('tpl-subject', (panel) => {
      const wrap = panel.querySelector('#f-subject-colors');
      const colors = ['#FDE047', '#A7F3D0', '#BFDBFE', '#FBCFE8', '#FED7AA'];
      wrap.innerHTML = colors.map(c => `<button class="w-8 h-8 rounded border-2 border-black" style="background:${c}" data-color="${c}"></button>`).join('');
      wrap.dataset.selected = colors[0];
      wrap.addEventListener('click', ev => {
        if(ev.target.dataset.color) {
          wrap.querySelectorAll('button').forEach(b => b.classList.remove('ring-2', 'ring-black'));
          ev.target.classList.add('ring-2', 'ring-black');
          wrap.dataset.selected = ev.target.dataset.color;
        }
      });
    });
  }
  else if (act === 'save-subject') {
    const name = $('#f-subject-name').value;
    const color = $('#f-subject-colors').dataset.selected;
    if (!name) return toast('กรุณากรอกชื่อวิชา', 'error');
    
    try {
      const created = await api('createSubject', { Name: name, TeacherID: state.user.ID, Color: color });
      state.subjects.push(created);
      closeModal();
      toast('เพิ่มวิชาสำเร็จ');
      renderPage('subjects');
    } catch (err) { toast(err.message, 'error'); }
  }
});

// Router Listener
window.addEventListener('hashchange', () => {
  const page = location.hash.replace('#/', '') || 'dashboard';
  if (state.subjects.length > 0) {
    renderPage(page);
    // ปิด sidebar บนมือถือ
    if(window.innerWidth < 1024) {
      $('#sidebar').classList.add('-translate-x-full');
      $('#mobileOverlay').classList.add('hidden');
    }
  }
});

// Initial Boot
document.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('kruboard_user');
  if (savedUser) {
    state.user = JSON.parse(savedUser);
    initApp();
  }
});
</script>
