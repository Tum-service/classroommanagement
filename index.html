/* ============================================================
   2) API LAYER  (GAS  <->  Mock fallback)
============================================================ */
async function api(action, payload = {}, method = 'GET') {
  if (CONFIG.USE_MOCK) return mockApi(action, payload);
  try {
    let res;
    if (method === 'GET') {
      const qs = new URLSearchParams({ action, ...payload }).toString();
      res = await fetch(`${CONFIG.API_URL}?${qs}`, { method: 'GET', redirect: 'follow' });
    } else {
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
        body: JSON.stringify({ action, ...payload }),
        redirect: 'follow'
      });
    }
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  } catch (err) {
    console.warn('[API] fallback → mock:', err);
    toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ใช้ข้อมูลตัวอย่างแทน', 'warn');
    return mockApi(action, payload);
  }
}

function mockApi(action, p = {}) {
  const db = MOCK;
  const genId = (arr, prefix) => prefix + (arr.length + 1);
  switch (action) {
    case 'ping': return { message: 'pong (mock)' };
    case 'login': return db.Users.find(u => u.Email === p.email) || db.Users[0];
    case 'getUsers': return db.Users;
    case 'getStudents': return db.Users.filter(u => u.Role === 'student');
    case 'getSubjects': return db.Subjects;
    case 'getClassrooms': return db.Classrooms;
    case 'getMissions':
      return (!p.status || p.status === 'all')
        ? db.Missions
        : db.Missions.filter(m => m.Status === p.status);
    case 'getGrades': return db.Grades;
    case 'getMentalCheckins': return db.MentalCheckins;
    case 'getTerms': return db.Terms;

    case 'createMission': {
      const m = {
        ID: genId(db.Missions, 'MIS'),
        Title: p.Title,
        SubjectID: p.SubjectID,
        Status: p.Status || 'active',
        CreatedAt: new Date().toISOString().slice(0, 10)
      };
      db.Missions.unshift(m);
      return m;
    }
    case 'saveGrade': {
      const students = db.Users.filter(u => u.Role === 'student');
      const created = [];
      students.forEach((s, i) => {
        const g = {
          ID: 'GRA' + (db.Grades.length + 1 + i),
          StudentID: s.ID,
          SubjectID: p.SubjectID,
          TaskName: p.TaskName,
          TotalScore: Number(p.TotalScore) || 0,
          PassScore: Number(p.PassScore) || 0,
          ActualScore: 0
        };
        db.Grades.push(g);
        created.push(g);
      });
      return created;
    }
    case 'createSubject': {
      const s = { ID: genId(db.Subjects, 'SUB'), Name: p.Name, TeacherID: 'USE1', Color: p.Color || '#FDE047' };
      db.Subjects.push(s);
      return s;
    }
    case 'updateSubject': {
      const s = db.Subjects.find(x => x.ID === p.ID);
      if (s) { s.Name = p.Name ?? s.Name; s.Color = p.Color ?? s.Color; }
      return s;
    }
    case 'deleteSubject': {
      const i = db.Subjects.findIndex(x => x.ID === p.ID);
      if (i > -1) db.Subjects.splice(i, 1);
      return { deleted: i > -1 };
    }
    case 'createTerm': {
      if (p.Status === 'current') db.Terms.forEach(t => t.Status = 'closed');
      const t = { ID: genId(db.Terms, 'TER'), TermName: p.TermName, Status: p.Status || 'current' };
      db.Terms.unshift(t);
      return t;
    }
    case 'exportData': {
      const rows = db[({ grades: 'Grades', scores: 'Grades', missions: 'Missions', students: 'Users',
                         subjects: 'Subjects', mental: 'MentalCheckins', terms: 'Terms',
                         classrooms: 'Classrooms' })[p.type]] || [];
      return {
        fileId: 'mock',
        name: `kruboard_${p.type}_${Date.now()}.csv`,
        url: '#',
        downloadUrl: '#',
        rows: rows.length
      };
    }
    default:
      throw new Error('Unknown action: ' + action);
  }
}

/* ---------- 8.13 Gradebook ---------- */
function subjectTasks(subjectId) {
  const map = {};
  state.grades.filter(g => g.SubjectID === subjectId).forEach(g => {
    if (!map[g.TaskName]) {
      map[g.TaskName] = { TaskName: g.TaskName, TotalScore: Number(g.TotalScore) || 0, PassScore: Number(g.PassScore) || 0, scores: {} };
    }
    map[g.TaskName].scores[g.StudentID] = Number(g.ActualScore) || 0;
  });
  return Object.values(map);
}

/* ---------- 8.15 Insights ---------- */
PAGES.insights = () => {
  if (!state.loaded) return loadingBlock();

  const perSubject = state.subjects.map(s => {
    const rows = state.grades.filter(g => g.SubjectID === s.ID);
    const got = rows.reduce((a, b) => a + Number(b.ActualScore || 0), 0);
    const max = rows.reduce((a, b) => a + Number(b.TotalScore || 0), 0);
    return { subject: s, got, max, pct: max ? Math.round((got / max) * 100) : 0, count: rows.length };
  }).filter(x => x.count > 0);

  const avg = perSubject.length
    ? Math.round(perSubject.reduce((a, b) => a + b.pct, 0) / perSubject.length)
    : 0;

  return `
    ${pageHead('ข้อมูลอินไซต์ 🔎', 'วิเคราะห์ผลการเรียนและพฤติกรรมในห้องเรียน')}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
      ${statCard('คะแนนเฉลี่ย', avg + '%', '📈', '#FDE047')}
      ${statCard('งานที่บันทึก', state.grades.length, '📝')}
      ${statCard('เช็กอินสภาพใจ', state.mental.length, '💚')}
      ${statCard('นักเรียน', state.students.length, '🧑‍🎓')}
    </div>

    <div class="grid lg:grid-cols-2 gap-4">
      <div class="nb-card p-4">
        <h2 class="font-bold text-lg mb-4">ผลการเรียนรายวิชา</h2>
        <div class="space-y-3">
          ${perSubject.length ? perSubject.map(x => `
            <div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span>${esc(x.subject.Name)}</span><span>${x.pct}%</span>
              </div>
              <div class="h-4 rounded-full border-2 border-black bg-white overflow-hidden">
                <div class="h-full" style="width:${x.pct}%;background:${x.pct >= 60 ? '#A7F3D0' : x.pct >= 40 ? '#FDE047' : '#FCA5A5'}"></div>

        <h2 class="font-bold text-lg mb-4">อารมณ์นักเรียน (สะสม)</h2>
        <div class="space-y-2.5">

            return `
              <div class="flex items-center gap-2 text-xs">
                <span class="text-base">${m.emoji}</span>

      <button class="nb-card p-5 text-left hover:bg-[#FECACA] transition" data-act="report-type" data-type="bug">
        <div class="text-3xl">🐞</div>
        <div class="font-bold mt-2">แจ้งบั๊ก</div>
        <div class="text-[11px] text-gray-500 mt-0.5">พบข้อผิดพลาดในการใช้งาน</div>
      </button>
      <button class="nb-card p-5 text-left hover:bg-[#A7F3D0] transition" data-act="report-type" data-type="feedback">
        <div class="text-3xl">💡</div>
        <div class="font-bold mt-2">เสนอไอเดีย</div>
        <div class="text-[11px] text-gray-500 mt-0.5">อยากให้มีฟีเจอร์อะไรเพิ่ม</div>
      </button>
    </div>

    <div class="nb-card p-5 max-w-2xl">
      <label class="text-xs font-bold">รายละเอียด</label>
      <textarea id="reportText" rows="5" class="nb-input mt-1" placeholder="อธิบายสิ่งที่เกิดขึ้น..."></textarea>

      <label class="text-xs font-bold block mt-3">ความเร่งด่วน</label>
      <select id="reportPriority" class="nb-input mt-1">
        <option value="low">ต่ำ — ไม่กระทบการใช้งาน</option>
        <option value="normal" selected>ปกติ — ใช้งานได้แต่ติดขัด</option>
        <option value="high">สูง — ใช้งานไม่ได้เลย</option>
      </select>

      <button class="nb-btn nb-btn-y w-full mt-4" data-act="send-report">📨 ส่งเรื่องถึงทีมงาน</button>
    </div>`;
};

/* ---------- 8.20 Not found ---------- */
PAGES.notfound = () => `
  ${pageHead('ไม่พบหน้านี้ 404', '')}
  <div class="nb-card p-10 text-center">
    <div class="text-7xl">🐻❓</div>
    <div class="font-bold mt-3">น้องหมีหาหน้านี้ไม่เจอ</div>
    <a href="#/dashboard" class="nb-btn nb-btn-y mt-4 inline-flex">กลับแดชบอร์ด</a>
  </div>`;

/* ============================================================
   9) ROUTER
============================================================ */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  return { page: parts[0] || 'dashboard', param: parts[1] || null };
}

function render() {
  const { page, param } = parseHash();
  const view = $('#view');
  const fn = PAGES[page] || PAGES.notfound;

  view.innerHTML = fn(param);

  $('#pageTitle').textContent = PAGE_TITLES[page] || 'KruBoard';
  $('#breadcrumb').textContent = 'หน้าแรก / ' + (PAGE_TITLES[page] || page);

  markActiveNav(page);
  closeSidebarMobile();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

window.addEventListener('hashchange', () => {
  // reset subject selection when switching pages
  const { page } = parseHash();
  if (['attendance', 'exp', 'tools', 'status'].includes(page)) {
    // keep selection if same page
  } else {
    state.ui.sel = {};
  }
  state.ui.classTab = 'status';
  render();
});

/* ============================================================
   10) MODAL HELPERS
============================================================ */
function openModal(tplId, fill) {
  const tpl = document.getElementById(tplId);
  const layer = $('#modalLayer');
  const panel = $('#modalPanel');
  panel.replaceChildren(tpl.content.cloneNode(true));
  if (fill) fill(panel);
  layer.classList.remove('hidden');
  layer.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const layer = $('#modalLayer');
  layer.classList.add('hidden');
  layer.classList.remove('flex');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   11) SIDEBAR MOBILE
============================================================ */
function openSidebarMobile() {
  $('#sidebar').classList.remove('-translate-x-full');
  $('#mobileOverlay').classList.remove('hidden');
}
function closeSidebarMobile() {
  if (window.innerWidth < 1024) {
    $('#sidebar').classList.add('-translate-x-full');
    $('#mobileOverlay').classList.add('hidden');
  }
}

/* ============================================================
   12) GLOBAL EVENT DELEGATION
============================================================ */
document.addEventListener('click', (e) => {

  /* --- close buttons --- */
  if (e.target.closest('[data-close]')) { closeModal(); return; }

  /* --- sidebar toggles --- */
  if (e.target.closest('#openSidebar')) { openSidebarMobile(); return; }
  if (e.target.closest('#closeSidebar') || e.target.closest('#mobileOverlay')) { closeSidebarMobile(); return; }

  /* --- actions --- */
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  switch (act) {

    /* ---------- SUBJECT PICK ---------- */
    case 'pick':
      state.ui.sel[t.dataset.page] = t.dataset.subject;
      render();
      break;

    case 'unpick':
      state.ui.sel[t.dataset.page] = null;
      render();
      break;

    /* ---------- MISSIONS ---------- */
    case 'filter-mission':
      state.ui.missionFilter = t.dataset.filter;
      render();
      break;

    case 'open-mission': {
      openModal('tpl-mission', (panel) => {
        const sel = panel.querySelector('#f-mission-subject');
        sel.innerHTML = state.subjects.map(s => `<option value="${s.ID}">${esc(s.Name)}</option>`).join('');
      });
      break;
    }

    case 'save-mission': {
      const title = $('#f-mission-title').value.trim();
      const subjectId = $('#f-mission-subject').value;
      const status = $('#f-mission-status').value;
      if (!title) { toast('กรุณากรอกชื่อภารกิจ', 'err'); break; }
      const created = await api('createMission', { Title: title, SubjectID: subjectId, Status: status }, 'POST');
      state.missions.unshift(created);
      closeModal();
      toast('สร้างภารกิจสำเร็จ ✅');
      render();
      break;
    }

    /* ---------- ATTENDANCE ---------- */
    case 'cycle-att': {
      const key = t.dataset.subject + '-' + t.dataset.student;
      const order = ['present', 'late', 'absent'];
      const cur = state.ui.attendance[key] || 'present';
      state.ui.attendance[key] = order[(order.indexOf(cur) + 1) % order.length];
      render();
      break;
    }

    case 'save-att':
      toast('บันทึกการเช็กชื่อเรียบร้อย ✅');
      break;

    /* ---------- EXP ---------- */
    case 'give-exp': {
      const id = t.dataset.student;
      state.ui.expPoints[id] = (state.ui.expPoints[id] || 0) + Number(t.dataset.pts);
      toast(`ให้ EXP +${t.dataset.pts} แต้ม ⚡`);
      render();
      break;
    }

    /* ---------- CLASSROOM ---------- */
    case 'class-tab':
      state.ui.classTab = t.dataset.tab;
      render();
      break;

    /* ---------- GRADEBOOK ---------- */
    case 'toggle-exp':
      state.ui.expToggle = !state.ui.expToggle;
      render();
      break;

    case 'open-grade': {
      openModal('tpl-grade');
      break;
    }

    case 'save-grade': {
      const task = $('#f-grade-task').value.trim();
      const total = Number($('#f-grade-total').value) || 0;
      const pass = Number($('#f-grade-pass').value) || 0;
      const subjectId = state.ui.sel.gradebook || t.dataset.subject ||
                        (parseHash().page === 'gradebook' ? parseHash().param : null) ||
                        state.subjects[0]?.ID;

      if (!task) { toast('กรุณากรอกชื่องาน', 'err'); break; }
      if (pass > total) { toast('คะแนนผ่านต้องไม่เกินคะแนนเต็ม', 'err'); break; }

      const created = await api('saveGrade', {
        SubjectID: subjectId, TaskName: task, TotalScore: total, PassScore: pass
      }, 'POST');

      if (Array.isArray(created)) state.grades.push(...created);
      closeModal();
      toast('บันทึกผลสำเร็จ 🎯');
      render();
      break;
    }

    /* ---------- SUBJECTS ---------- */
    case 'open-subject': {
      state.ui.editingSubject = null;
      openModal('tpl-subject', (panel) => paintColorPicker(panel, '#FDE047'));
      break;
    }

    case 'edit-subject': {
      const s = state.subjects.find(x => x.ID === t.dataset.id);
      state.ui.editingSubject = s;
      openModal('tpl-subject', (panel) => {
        panel.querySelector('#f-subject-name').value = s.Name;
        paintColorPicker(panel, s.Color);
      });
      break;
    }

    case 'save-subject': {
      const name = $('#f-subject-name').value.trim();
      const color = $('#f-subject-colors').dataset.color || '#FDE047';
      if (!name) { toast('กรุณากรอกชื่อวิชา', 'err'); break; }

      if (state.ui.editingSubject) {
        const updated = await api('updateSubject', { ID: state.ui.editingSubject.ID, Name: name, Color: color }, 'POST');
        const i = state.subjects.findIndex(x => x.ID === state.ui.editingSubject.ID);
        if (i > -1) state.subjects[i] = { ...state.subjects[i], ...updated };
        toast('แก้ไขวิชาสำเร็จ ✏️');
      } else {
        const created = await api('createSubject', { Name: name, Color: color }, 'POST');
        state.subjects.push(created);
        toast('เพิ่มวิชาสำเร็จ 📚');
      }
      closeModal();
      render();
      break;
    }

    case 'del-subject': {
      const id = t.dataset.id;
      openModal('tpl-confirm', (panel) => {
        panel.querySelector('#f-confirm-title').textContent = 'ลบวิชานี้?';
        panel.querySelector('#f-confirm-msg').textContent = 'ข้อมูลห้องเรียนและคะแนนที่ผูกกับวิชานี้อาจได้รับผลกระทบ';
        panel.querySelector('#f-confirm-ok').addEventListener('click', async () => {
          await api('deleteSubject', { ID: id }, 'POST');
          state.subjects = state.subjects.filter(s => s.ID !== id);
          closeModal();
          toast('ลบวิชาแล้ว 🗑️');
          render();
        });
      });
      break;
    }

    case 'board':
      toast('สร้างบอร์ดการเรียนการสอนแล้ว 📋');
      break;

    /* ---------- TERMS ---------- */
    case 'open-term':
      openModal('tpl-term');
      break;

    case 'save-term': {
      const name = $('#f-term-name').value.trim();
      const status = $('#f-term-status').value;
      if (!name) { toast('กรุณากรอกชื่อเทอม', 'err'); break; }
      const created = await api('createTerm', { TermName: name, Status: status }, 'POST');
      if (status === 'current') state.terms.forEach(x => x.Status = 'closed');
      state.terms.unshift(created);
      closeModal();
      toast('สร้างเทอมใหม่สำเร็จ 📅');
      render();
      break;
    }

    /* ---------- EXPORT ---------- */
    case 'export': {
      const type = t.dataset.type;
      toast('กำลังสร้างไฟล์... ⏳');
      const res = await api('exportData', { type, term: '2/2569' }, 'POST');
      setTimeout(() => {
        toast(`Export ${type} สำเร็จ — ${res.rows ?? ''} แถว 📤`);
        if (res.downloadUrl && res.downloadUrl !== '#') {
          window.open(res.downloadUrl, '_blank');
        }
      }, 600);
      break;
    }

    /* ---------- MISC ---------- */
    case 'copy-ref': {
      const input = $('#refLink');
      input.select();
      try { document.execCommand('copy'); } catch (_) {}
      navigator.clipboard?.writeText(input.value).catch(() => {});
      toast('คัดลอกลิงก์แล้ว 📋');
      break;
    }

    case 'tool':
      toast(`เปิดเครื่องมือ: ${t.dataset.name} 🧰`);
      break;

    case 'notify':
      toast('จะแจ้งเตือนเมื่อฟีเจอร์พร้อม 🔔');
      break;

    case 'coming':
      toast('ฟีเจอร์นี้กำลังจะมาเร็วๆ นี้ ✨');
      break;

    case 'tpl-tab':
      toast('ตัวกรองเทมเพลต (ตัวอย่าง) 🌌');
      break;

    case 'checkin':
      toast('เปิดแบบฟอร์มเช็กอินสภาพใจ 💚');
      break;

    case 'report-type':
      toast(t.dataset.type === 'bug' ? 'เลือกประเภท: แจ้งบั๊ก 🐞' : 'เลือกประเภท: เสนอไอเดีย 💡');
      break;

    case 'send-report': {
      const text = $('#reportText').value.trim();
      if (!text) { toast('กรุณากรอกรายละเอียด', 'err'); break; }
      $('#reportText').value = '';
      toast('ส่งเรื่องถึงทีมงานแล้ว ขอบคุณ 🙏');
      break;
    }
  }
});

/* color picker สำหรับ modal วิชา */
function paintColorPicker(panel, current) {
  const colors = ['#FDE047', '#A7F3D0', '#BFDBFE', '#FBCFE8', '#FED7AA', '#E5E7EB', '#C4B5FD', '#99F6E4'];
  const wrap = panel.querySelector('#f-subject-colors');
  wrap.dataset.color = current;
  wrap.innerHTML = colors.map(c => `
    <button class="w-9 h-9 rounded-lg border-2 border-black transition"
      style="background:${c};box-shadow:${c === current ? '3px 3px 0 #000' : '1px 1px 0 #000'}"
      data-color="${c}">${c === current ? '✓' : ''}</button>
  `).join('');

  wrap.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-color]');
    if (!btn) return;
    paintColorPicker(panel, btn.dataset.color);
  });
}

/* ============================================================
   13) BOOT
============================================================ */
async function init() {
  renderSidebar();

  // initial paint (loading skeleton)
  render();

  const [users, students, subjects, classrooms, missions, grades, mental, terms] = await Promise.all([
    api('getUsers'),
    api('getStudents'),
    api('getSubjects'),
    api('getClassrooms'),
    api('getMissions'),
    api('getGrades'),
    api('getMentalCheckins'),
    api('getTerms')
  ]);

  state.user       = users.find(u => u.Role === 'teacher') || users[0];
  state.students   = students;
  state.subjects   = subjects;
  state.classrooms = classrooms;
  state.missions   = missions;
  state.grades     = grades;
  state.mental     = mental;
  state.terms      = terms;
  state.loaded     = true;

  // header user chip
  $('#userName').textContent = state.user?.Name || 'ครู';
  $('#userRole').textContent = state.user?.Role === 'teacher' ? 'ครูผู้สอน' : 'นักเรียน';
  const chip = $('#userChip').querySelector('div');
  if (chip) chip.textContent = state.user?.Avatar || '👩‍🏫';

  const currentTerm = state.terms.find(t => t.Status === 'current');
  if (currentTerm) $('#termBadge').querySelector('span').textContent = currentTerm.TermName;

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
